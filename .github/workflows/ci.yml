name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (codeQuality + test + coverage + screenshots + Sonar)
    runs-on: ubuntu-26.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarCloud needs it for per-line blame and the new-code period.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Same JDK as gradle/gradle-daemon-jvm.properties, so Gradle does not provision another one.
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-scan-publish: ${{ !github.event.repository.private }}
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Static analysis (codeQuality)
        run: ./gradlew codeQuality --no-daemon --stacktrace

      - name: Unit tests, coverage gate and screenshot gate
        run: ./gradlew testDebugUnitTest koverVerifyDebug verifyRoborazziDebug --no-daemon --stacktrace

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --no-daemon --stacktrace

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
            app/src/test/screenshots/
          if-no-files-found: ignore
          retention-days: 7
